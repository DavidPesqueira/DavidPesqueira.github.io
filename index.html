<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offset Intel LLC</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    body {
      margin: 0;
      padding: 0;
      font-family: 'Press Start 2P', cursive;
      background: linear-gradient(135deg, #1f0036 0%, #ff00cc 100%);
      color: #00ffff;
      text-align: center;
    }

    header {
      padding: 60px 20px;
      background: #00000066;
      box-shadow: 0 0 15px #ff00cc;
    }

    header h1 {
      font-size: 2em;
      margin: 0;
      color: #ff00cc;
      text-shadow: 2px 2px #000;
    }

    main {
      padding: 40px 20px;
    }

    section {
      margin-bottom: 40px;
    }

    .neon-box {
      background-color: #111;
      border: 2px solid #00ffff;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
      box-shadow: 0 0 20px #00ffff;
    }

    footer {
      padding: 20px;
      background: #00000066;
      color: #999;
      font-size: 0.8em;
    }

    a {
      color: #ffcc00;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <h1>OFFSET INTEL LLC</h1>
    <p>Cyber Ops & Red Team Consultancy</p>
  </header>
  <main>
    <section class="neon-box">
      <h2>Who We Are</h2>
      <p>Offset Intel LLC is your go-to shop for adversarial simulation, pentesting, and threat emulation. Built for the digital underground.</p>
    </section>

    <section class="neon-box">
      <h2>Get in Touch</h2>
      <p>Reach out: <a href="mailto:ops@offsetintel.com">ops@offsetintel.com</a></p>
    </section>
  </main>
  <footer>
    <p>&copy; 2025 Offset Intel LLC. All Rights Reserved.</p>
  </footer>
</body>
</html>
