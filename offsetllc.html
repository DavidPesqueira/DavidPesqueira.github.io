<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offset Intel LLC</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<!-- sidebar.html -->
  <!-- JavaScript-based Sidebar Loader -->
  <div id="sidebar-container"></div>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      fetch('sidebar.html')
        .then(res => res.text())
        .then(html => {
          document.getElementById('sidebar-container').innerHTML = html;
        });
    });
  </script>

  <div class="content">
    <header>
      <img src="media/offsetlogo.png" alt="Offset Intel Logo" style="max-width: 300px; margin: 30px auto; display: block;" />
      <h1>OFFSET INTEL LLC</h1>
      <p>Cyber Ops & Red Team Consultancy</p>
    </header>

    <main>
      <section class="neon-box">
        <h2>Who We Are</h2>
        <p>
          Offset Intel LLC is your go-to shop for adversarial simulation, pentesting, and threat emulation. Built for the digital underground.
        </p>
      </section>

      <section class="neon-box">
        <h2>Get in Touch</h2>
        <p>Reach out: <a href="mailto:ops@offsetintel.com">ops@offsetintel.com</a></p>
      </section>
    </main>

    <footer>
      <p>&copy; 2025 Offset Intel LLC. All Rights Reserved.</p>
    </footer>
  </div>
</body>
</html>
